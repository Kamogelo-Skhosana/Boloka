name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  frontend:
    name: Frontend (React / Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect frontend
        id: fe
        run: |
          if [ -f frontend/package.json ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No frontend/package.json yet — skipping until the app is scaffolded."
          fi

      - uses: actions/setup-node@v4
        if: steps.fe.outputs.run == 'true'
        with:
          node-version: 20

      - name: Install, lint & build
        if: steps.fe.outputs.run == 'true'
        working-directory: frontend
        run: |
          npm install
          npm run lint --if-present
          npm run test --if-present
          npm run build --if-present

  backend:
    name: Backend (FastAPI / Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect backend
        id: be
        run: |
          if [ -f backend/requirements.txt ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No backend/requirements.txt yet — skipping until the API is scaffolded."
          fi

      - uses: actions/setup-python@v5
        if: steps.be.outputs.run == 'true'
        with:
          python-version: '3.12'
          cache: pip

      - name: Install, lint & test
        if: steps.be.outputs.run == 'true'
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest
          ruff check .
          pytest -q
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  frontend:
    name: Frontend (React / Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect frontend
        id: fe
        run: |
          if [ -f frontend/package.json ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No frontend/package.json yet — skipping until the app is scaffolded."
          fi

      - uses: actions/setup-node@v4
        if: steps.fe.outputs.run == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install, lint & build
        if: steps.fe.outputs.run == 'true'
        working-directory: frontend
        run: |
          npm ci
          npm run lint --if-present
          npm run test --if-present
          npm run build --if-present

  backend:
    name: Backend (FastAPI / Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect backend
        id: be
        run: |
          if [ -f backend/requirements.txt ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No backend/requirements.txt yet — skipping until the API is scaffolded."
          fi

      - uses: actions/setup-python@v5
        if: steps.be.outputs.run == 'true'
        with:
          python-version: '3.12'
          cache: pip

      - name: Install, lint & test
        if: steps.be.outputs.run == 'true'
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest
          ruff check .
          pytest -q
