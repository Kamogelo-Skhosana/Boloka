name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (React / Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Detect frontend
        id: fe
        run: |
          if [ -f frontend/package.json ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No frontend/package.json yet — skipping until the app is scaffolded."
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.fe.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install, lint & build
        if: steps.fe.outputs.run == 'true'
        working-directory: frontend
        run: |
          npm ci
          npm run lint --if-present
          npm run test --if-present
          npm run build --if-present

  backend:
    name: Backend (FastAPI / Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Detect backend
        id: be
        run: |
          if [ -f backend/requirements.txt ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No backend/requirements.txt yet — skipping until the API is scaffolded."
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: steps.be.outputs.run == 'true'
        with:
          python-version: '3.12'
          cache: pip

      - name: Install, lint & test
        if: steps.be.outputs.run == 'true'
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest
          ruff check .
          python -m pytest -q
